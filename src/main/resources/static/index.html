<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product &amp; Order Management</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#4f46e5; --danger:#dc2626; --ok:#16a34a; --border:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1000px; margin:20px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:17px; }
  input, textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font:inherit; margin-bottom:8px; }
  button { background:var(--primary); color:#fff; border:0; border-radius:6px; padding:7px 14px; font:inherit; cursor:pointer; }
  button:hover { opacity:.9; }
  button.secondary { background:#6b7280; }
  button.danger { background:var(--danger); }
  button.success { background:var(--ok); }
  button.light { background:#fff; color:var(--primary); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:14px; }
  th { color:var(--muted); font-weight:600; }
  td input { margin:0; padding:5px 6px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { background:#fff; color:var(--text); border:1px solid var(--border); }
  .tabs button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .row { display:flex; gap:8px; align-items:center; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
  .badge.on { background:#dcfce7; color:#166534; } .badge.off { background:#fee2e2; color:#991b1b; }
  .muted { color:var(--muted); font-size:13px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:700px){ .grid2{ grid-template-columns:1fr; } }
  #toast { position:fixed; bottom:20px; right:20px; padding:12px 18px; border-radius:8px; color:#fff; display:none; max-width:360px; z-index:10; }
  #toast.err { background:var(--danger); } #toast.ok { background:var(--ok); }
  .hidden { display:none !important; }
  .total { text-align:right; font-weight:700; font-size:16px; margin-top:10px; }
  .order { border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <h1> Product &amp; Order Management</h1>
  <div id="userBox" class="row hidden">
    <span id="whoami"></span>
    <button class="light" onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <!-- ========== AUTH ========== -->
  <section id="authView" class="grid2">
    <div class="card">
      <h2>Login</h2>
      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
      <button onclick="login()">Login</button>
      <p class="muted">Admin demo: admin@example.com / admin123</p>
    </div>
    <div class="card">
      <h2>Register (USER)</h2>
      <input id="regName" placeholder="Full name">
      <input id="regEmail" type="email" placeholder="Email">
      <input id="regPassword" type="password" placeholder="Password (min 6 chars)">
      <button class="success" onclick="register()">Create account</button>
    </div>
  </section>

  <!-- ========== USER VIEW ========== -->
  <section id="userView" class="hidden">
    <div class="tabs">
      <button id="tabProducts" onclick="showUserTab('products')">Products</button>
      <button id="tabCart" onclick="showUserTab('cart')">My Cart</button>
      <button id="tabOrders" onclick="showUserTab('orders')">My Orders</button>
    </div>
    <div id="userProducts" class="card"></div>
    <div id="userCart" class="card hidden"></div>
    <div id="userOrders" class="card hidden"></div>
  </section>

  <!-- ========== ADMIN VIEW ========== -->
  <section id="adminView" class="hidden">
    <div class="card">
      <h2>Add product</h2>
      <div class="grid2">
        <div><input id="apName" placeholder="Name"><textarea id="apDesc" rows="2" placeholder="Description"></textarea></div>
        <div><input id="apPrice" type="number" step="0.01" min="0.01" placeholder="Price">
             <input id="apQty" type="number" min="0" placeholder="Quantity"></div>
      </div>
      <button class="success" onclick="addProduct()">Add product</button>
    </div>
    <div class="card"><h2>All products</h2><div id="adminProducts"></div></div>
  </section>
</main>

<div id="toast"></div>

<script>
let auth = null;   // { header: "Basic ...", user: {...} }

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n).toFixed(2);

function toast(msg, ok) {
  const t = $('toast');
  t.textContent = msg;
  t.className = ok ? 'ok' : 'err';
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', 3500);
}

async function api(path, method, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth) headers['Authorization'] = auth.header;
  const res = await fetch(path, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  if (!res.ok) {
    let msg = (data && data.message) ? data.message : ('Request failed (' + res.status + ')');
    if (data && data.fieldErrors) {
      msg += ': ' + Object.entries(data.fieldErrors).map(([k, v]) => k + ' - ' + v).join('; ');
    }
    throw new Error(msg);
  }
  return data;
}

async function run(fn) {
  try { await fn(); } catch (e) { toast(e.message, false); }
}

// ---------------- AUTH ----------------
function basicHeader(email, password) {
  return 'Basic ' + btoa(unescape(encodeURIComponent(email + ':' + password)));
}

function login() {
  run(async () => {
    const email = $('loginEmail').value.trim();
    const password = $('loginPassword').value;
    if (!email || !password) throw new Error('Enter email and password');
    auth = { header: basicHeader(email, password), user: null };
    try {
      auth.user = await api('/api/auth/me');
    } catch (e) {
      auth = null;
      throw e;
    }
    sessionStorage.setItem('auth', JSON.stringify(auth));
    showApp();
  });
}

function register() {
  run(async () => {
    const body = { name: $('regName').value, email: $('regEmail').value, password: $('regPassword').value };
    const saved = auth; auth = null;
    try { await api('/api/auth/register', 'POST', body); } finally { auth = saved; }
    toast('Account created! You can login now.', true);
    $('loginEmail').value = body.email;
    $('loginPassword').value = '';
    $('regName').value = $('regEmail').value = $('regPassword').value = '';
  });
}

function logout() {
  auth = null;
  sessionStorage.removeItem('auth');
  ['userView', 'adminView', 'userBox'].forEach(id => $(id).classList.add('hidden'));
  $('authView').classList.remove('hidden');
}

function showApp() {
  $('authView').classList.add('hidden');
  $('userBox').classList.remove('hidden');
  $('whoami').textContent = auth.user.name + ' (' + auth.user.role + ')';
  if (auth.user.role === 'ADMIN') {
    $('adminView').classList.remove('hidden');
    $('userView').classList.add('hidden');
    loadAdminProducts();
  } else {
    $('userView').classList.remove('hidden');
    $('adminView').classList.add('hidden');
    showUserTab('products');
  }
}

// ---------------- USER ----------------
function showUserTab(tab) {
  ['products', 'cart', 'orders'].forEach(t => {
    const view = $('user' + t.charAt(0).toUpperCase() + t.slice(1));
    const btn = $('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    view.classList.toggle('hidden', t !== tab);
    btn.classList.toggle('active', t === tab);
  });
  if (tab === 'products') loadUserProducts();
  if (tab === 'cart') loadCart();
  if (tab === 'orders') loadOrders();
}

function loadUserProducts() {
  run(async () => {
    const products = await api('/api/products');
    if (!products.length) { $('userProducts').innerHTML = '<h2>Products</h2><p class="muted">No products available.</p>'; return; }
    $('userProducts').innerHTML = '<h2>Products</h2><table><tr><th>Name</th><th>Description</th><th>Price</th><th>In stock</th><th>Qty</th><th></th></tr>' +
      products.map(p => `<tr>
        <td><b>${esc(p.name)}</b></td><td class="muted">${esc(p.description)}</td>
        <td>${money(p.price)}</td><td>${p.quantity}</td>
        <td style="width:80px"><input type="number" min="1" value="1" id="qty-${p.id}"></td>
        <td><button onclick="addToCart(${p.id})" ${p.quantity === 0 ? 'disabled' : ''}>Add to cart</button></td></tr>`).join('') + '</table>';
  });
}

function addToCart(productId) {
  run(async () => {
    const quantity = parseInt($('qty-' + productId).value, 10);
    await api('/api/cart/items', 'POST', { productId, quantity });
    toast('Added to cart', true);
  });
}

function loadCart() {
  run(async () => {
    const cart = await api('/api/cart');
    if (!cart.items.length) { $('userCart').innerHTML = '<h2>My Cart</h2><p class="muted">Your cart is empty.</p>'; return; }
    $('userCart').innerHTML = '<h2>My Cart</h2><table><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>' +
      cart.items.map(i => `<tr>
        <td>${esc(i.productName)}</td><td>${money(i.unitPrice)}</td>
        <td style="width:90px"><input type="number" min="1" value="${i.quantity}" id="cq-${i.productId}"></td>
        <td>${money(i.subtotal)}</td>
        <td class="row"><button class="secondary" onclick="updateCartItem(${i.productId})">Update</button>
            <button class="danger" onclick="removeCartItem(${i.productId})">Remove</button></td></tr>`).join('') +
      `</table><div class="total">Total: ${money(cart.totalAmount)}</div>
       <div class="row" style="justify-content:flex-end;margin-top:10px">
         <button class="secondary" onclick="clearCart()">Clear cart</button>
         <button class="success" onclick="placeOrder()">Place order</button></div>`;
  });
}

function updateCartItem(productId) {
  run(async () => {
    const quantity = parseInt($('cq-' + productId).value, 10);
    await api('/api/cart/items/' + productId, 'PUT', { quantity });
    toast('Cart updated', true);
    loadCart();
  });
}
function removeCartItem(productId) {
  run(async () => { await api('/api/cart/items/' + productId, 'DELETE'); toast('Item removed', true); loadCart(); });
}
function clearCart() {
  run(async () => { await api('/api/cart', 'DELETE'); loadCart(); });
}
function placeOrder() {
  run(async () => {
    const order = await api('/api/orders', 'POST');
    toast('Order #' + order.orderId + ' placed! Total ' + money(order.totalAmount), true);
    showUserTab('orders');
  });
}

function loadOrders() {
  run(async () => {
    const orders = await api('/api/orders');
    if (!orders.length) { $('userOrders').innerHTML = '<h2>My Orders</h2><p class="muted">No orders yet.</p>'; return; }
    $('userOrders').innerHTML = '<h2>My Orders</h2>' + orders.map(o => `<div class="order">
      <div class="row" style="justify-content:space-between"><b>Order #${o.orderId}</b>
        <span class="badge on">${esc(o.status)}</span></div>
      <div class="muted">${esc(String(o.createdAt).replace('T', ' ').substring(0, 19))}</div>
      <table>${o.items.map(i => `<tr><td>${esc(i.productName)}</td><td>${i.quantity} × ${money(i.unitPrice)}</td><td>${money(i.subtotal)}</td></tr>`).join('')}</table>
      <div class="total">Total: ${money(o.totalAmount)}</div></div>`).join('');
  });
}

// ---------------- ADMIN ----------------
function loadAdminProducts() {
  run(async () => {
    const products = await api('/api/products');
    $('adminProducts').innerHTML = '<table><tr><th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th>Status</th><th>Actions</th></tr>' +
      products.map(p => `<tr>
        <td>${p.id}</td><td><b>${esc(p.name)}</b></td>
        <td style="width:120px"><input type="number" step="0.01" min="0.01" id="ap-price-${p.id}" value="${p.price}"></td>
        <td style="width:100px"><input type="number" min="0" id="ap-qty-${p.id}" value="${p.quantity}"></td>
        <td><span class="badge ${p.enabled ? 'on' : 'off'}">${p.enabled ? 'Enabled' : 'Disabled'}</span></td>
        <td class="row"><button onclick="updateProduct(${p.id})">Save</button>
          <button class="${p.enabled ? 'danger' : 'success'}" onclick="setStatus(${p.id}, ${!p.enabled})">${p.enabled ? 'Disable' : 'Enable'}</button></td></tr>`).join('') + '</table>';
  });
}

function addProduct() {
  run(async () => {
    const body = {
      name: $('apName').value,
      description: $('apDesc').value,
      price: $('apPrice').value === '' ? null : Number($('apPrice').value),
      quantity: $('apQty').value === '' ? null : parseInt($('apQty').value, 10)
    };
    await api('/api/admin/products', 'POST', body);
    toast('Product added', true);
    $('apName').value = $('apDesc').value = $('apPrice').value = $('apQty').value = '';
    loadAdminProducts();
  });
}
function updateProduct(id) {
  run(async () => {
    const body = { price: Number($('ap-price-' + id).value), quantity: parseInt($('ap-qty-' + id).value, 10) };
    await api('/api/admin/products/' + id, 'PUT', body);
    toast('Product updated', true);
    loadAdminProducts();
  });
}
function setStatus(id, enabled) {
  run(async () => {
    await api('/api/admin/products/' + id + '/status', 'PATCH', { enabled });
    toast(enabled ? 'Product enabled' : 'Product disabled', true);
    loadAdminProducts();
  });
}

(function init() {
  const saved = sessionStorage.getItem('auth');
  if (saved) {
    try { auth = JSON.parse(saved); showApp(); } catch (e) { logout(); }
  }
})();
</script>
</body>
</html>
